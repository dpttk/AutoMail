---
# Common role tasks

- name: Update and upgrade apt packages
  become: true
  apt:
    upgrade: yes
    update_cache: yes
    cache_valid_time: 86400 # One day
  tags:
    - system
    - update

- name: Install required packages
  become: yes
  apt: 
    name: "{{ packages }}"
    state: latest
  tags:
    - packages
    - system

- name: Configure firewall
  become: yes
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ firewall_allowed_services }}"
  tags:
    - firewall
    - security

- name: Enable firewall
  become: yes
  community.general.ufw:
    state: enabled
    policy: deny
  tags:
    - firewall
    - security
